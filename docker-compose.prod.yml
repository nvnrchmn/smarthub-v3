# Smarthub V3 — Production Docker Compose
name: smarthub

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smarthub-api
    restart: unless-stopped
    ports:
      - "8082:4000"
    env_file:
      - .env.production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - smarthub-net
    volumes:
      - uploads:/app/uploads

  db:
    image: postgres:16-alpine
    container_name: smarthub-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: smarthub
      POSTGRES_USER: smarthub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smarthub"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - smarthub-net

  redis:
    image: redis:7-alpine
    container_name: smarthub-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - smarthub-net

  minio:
    image: minio/minio:latest
    container_name: smarthub-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    networks:
      - smarthub-net

  nginx:
    image: nginx:alpine
    container_name: smarthub-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_conf:/etc/letsencrypt
      - ./deploy/redirect.conf:/etc/nginx/conf.d/redirect.conf:ro
    depends_on:
      - app
    networks:
      - smarthub-net

networks:
  smarthub-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  uploads:
  certbot_conf: