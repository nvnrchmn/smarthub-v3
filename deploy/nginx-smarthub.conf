# Vhost smarthub.logikraf.id (aaPanel). API Go di 127.0.0.1:8082, frontend statis di root.
server {
    listen 80;
    server_name smarthub.logikraf.id;

    location /.well-known/acme-challenge/ {
        root /www/wwwroot/srv_acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name smarthub.logikraf.id;

    ssl_certificate     /etc/letsencrypt/live/smarthub.logikraf.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smarthub.logikraf.id/privkey.pem;

    root /www/wwwroot/smarthub.logikraf.id;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8082/health;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri /index.html;
    }
}
