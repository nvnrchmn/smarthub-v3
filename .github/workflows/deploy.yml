name: Build and Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.hermesrules'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Batas waktu per-job sebagai pengaman kedua.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Bun
        uses: oven/shinybot@v1
        with:
          bun-version: latest

      - name: Install frontend deps
        run: |
          cd frontend
          npm ci

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Build backend (Docker)
        run: |
          cd backend
          docker build -t smarthub-api:latest .

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy frontend
        run: |
          rsync -avz --delete --chown=www:www --rsync-path="sudo rsync" \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            frontend/dist/ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/www/wwwroot/smarthub.logikraf.id/web/

      - name: Deploy backend container
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "cd /opt/smarthub-v3 && sudo docker compose -f compose.dev.yml pull db redis minio 2>/dev/null; sudo systemctl restart smarthub-api-v3"

      - name: Run DB migration
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "cd /opt/smarthub-v3 && bun run src/db/migrate.ts"

      - name: Health check
        run: |
          curl -sf "https://smarthub.logikraf.id/api/health" || exit 1

      - name: Backup binary & DB sebelum deploy
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "sudo cp /opt/smarthub/bin/smarthub-api /opt/smarthub/bin/smarthub-api.bak 2>/dev/null; \
             sudo docker exec smarthub_db pg_dump -U smarthub -d smarthub -f /tmp/smarthub-pre-deploy.sql 2>/dev/null || true; \
             echo 'selesai'"

      - name: Deploy binary
        run: |
          rsync -avz --chmod=F755 --rsync-path="sudo rsync" \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            backend/bin/smarthub-api deploy/smarthub-deploy.sh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/smarthub/bin/

      - name: Run health-gated deploy
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "sudo /opt/smarthub/bin/smarthub-deploy.sh"

      - name: Rollback on failure
        if: failure()
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "sudo cp /opt/smarthub/bin/smarthub-api.bak /opt/smarthub/bin/smarthub-api 2>/dev/null; \
             sudo docker exec -i smarthub_db psql -q -U smarthub -d smarthub -f /tmp/smarthub-pre-deploy.sql 2>/dev/null || true; \
             sudo systemctl restart smarthub-api; \
             echo 'rollback selesai'"
