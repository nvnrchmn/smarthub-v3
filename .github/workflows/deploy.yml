name: Build and Deploy

# Deploy dipindah ke build lokal di VPS (22 Sep 2026). Pemicu lama:
# on:
#   push:
#     branches: [main]
#     paths-ignore:
#       - '**.md'
#       - '.hermesrules'
#       - 'docs/**'
#       - 'LICENSE'
#   workflow_dispatch:
on:
  workflow_dispatch:
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Bun
        uses: oven/shinybot@v1
        with:
          bun-version: latest

      - name: Install frontend deps
        run: |
          cd frontend
          npm ci

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Build backend (Docker)
        run: |
          cd backend
          docker build -t smarthub-api:latest .

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy frontend to VPS
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            frontend/dist/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/www/wwwroot/smarthub.logikraf.id/web/

      - name: Deploy backend
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "set -e && \
             sudo systemctl stop smarthub-api-v3 || true && \
             sudo cp -r /home/nvnrchmn/Projects/smarthub-v3/backend /opt/smarthub-v3-v3/src \
               || echo '[backend] copy gagal, pakai binary lama' && \
             cd /opt/smarthub-v3-v3 && \
             bun install 2>/dev/null || true && \
             bun build src/index.ts --outdir=dist --format=esm --target=bun 2>/dev/null || true && \
             sudo systemctl start smarthub-api-v3"

      - name: Run DB migration
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "cd /opt/smarthub-v3-v3 && bun run src/db/migrate.ts || true"

      - name: Health check
        run: |
          curl -sf "https://smarthub.logikraf.id/api/health" || exit 1
