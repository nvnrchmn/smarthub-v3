name: Build and Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.hermesrules'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Batas waktu per-job sebagai pengaman kedua.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'


      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Build Go binary
        run: |
          cd backend
          go vet ./...
          go test ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o bin/smarthub-api ./cmd/api
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o bin/smarthub-cli ./cmd/cli

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy frontend
        run: |
          rsync -avz --delete --chown=www:www --rsync-path="sudo rsync" \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            frontend/dist/ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/www/wwwroot/smarthub.logikraf.id/

      - name: Backup binary & DB sebelum deploy
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "sudo cp /opt/smarthub/bin/smarthub-api /opt/smarthub/bin/smarthub-api.bak 2>/dev/null; \
             sudo docker exec smarthub_db pg_dump -U smarthub -d smarthub -f /tmp/smarthub-pre-deploy.sql 2>/dev/null || true; \
             echo 'selesai'"

      - name: Deploy binary
        run: |
          rsync -avz --chmod=F755 --rsync-path="sudo rsync" \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            backend/bin/smarthub-api deploy/smarthub-deploy.sh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/smarthub/bin/

      - name: Run health-gated deploy
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "sudo /opt/smarthub/bin/smarthub-deploy.sh"

      - name: Rollback on failure
        if: failure()
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "sudo cp /opt/smarthub/bin/smarthub-api.bak /opt/smarthub/bin/smarthub-api 2>/dev/null; \
             sudo docker exec -i smarthub_db psql -q -U smarthub -d smarthub -f /tmp/smarthub-pre-deploy.sql 2>/dev/null || true; \
             sudo systemctl restart smarthub-api; \
             echo 'rollback selesai'"
